<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,100..1000;1,9..40,100..1000&display=swap"
      rel="stylesheet"
    />
    <title>Weather App</title>
  </head>
  <body>
    <header>
      <h1 class="page-title">
        <span class="blue-word">Sky</span><span class="yellow-word">Light</span>
      </h1>
      <button class="unit-switcher-btn" type="button">Switch Units</button>
      <div class="search-container">
        <label for="search-local">Search for a city</label>
        <input type="text" name="" id="search-local" />
        <button type="button" class="search-location-btn">
          <img src="./assets/images/magnifier.png" alt="" />
        </button>
      </div>
    </header>
    <main class="container">
      <div class="location-info-container">
        <div class="overall-status">
          <img
            class="status-icon"
            src="./assets/images/clear-night.png"
            alt=""
            class="weather-status-icon"
          />

          <p class="temperature-p">Temperature:</p>
        </div>
        <div class="detailed-status">
          <p class="humidity-p">Humidity:</p>
          <p class="wind-p">Wind Speed:</p>
          <p class="time-p">Time:</p>
        </div>
        <div class="location-description">
          <p class="local"></p>
          <p class="local-desc"></p>
        </div>
      </div>
    </main>
    <article class="day-details">
      <span>Weather Details</span>
      <div class="details-wrapper">
        <div class="info-wrapper">
          <p>Sunset</p>
          <p>Sunrises</p>
          <p>Timezone</p>
        </div>
        <div class="info-wrapper">
          <p>Wind Direction: º</p>
          <p>Wind gust m/s</p>
          <p>UV Index</p>
        </div>
        <div class="info-wrapper">
          <p>Visibility</p>
          <p>Pressure</p>
          <p>Cloud cover %</p>
        </div>
      </div>
    </article>
    <article class="full-day-forecast"></article>
    <article class="weeks-forecast">
      <div class="forecast-wrapper"></div>
    </article>
  </body>
</html>
